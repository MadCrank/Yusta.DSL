# ──────────────────────────────────────────────
# Yusta Dify Dev Environment
# ──────────────────────────────────────────────
# Minimal Dify stack for local development with
# auto-import of DSL workflows and pre-configured
# OpenAI-compatible model provider.
#
# Quickstart:
#   1. cp .env.example .env
#   2. Fill in OPENAI_API_KEY and OPENAI_API_BASE_URL
#   3. docker compose up -d
#   4. Open http://localhost:3000
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL ────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: yusta-dify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dify} -d ${DB_DATABASE:-dify}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ── Redis ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yusta-dify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-difyai123456}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ── Sandbox (Code Executor) ───────────────
  sandbox:
    image: langgenius/dify-sandbox:${DIFY_SANDBOX_VERSION:-latest}
    container_name: yusta-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: release
    volumes:
      - ./volumes/sandbox:/sandbox/dependencies
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Dify API ─────────────────────────────
  api:
    image: langgenius/dify-api:${DIFY_VERSION:-latest}
    container_name: yusta-dify-api
    restart: unless-stopped
    environment:
      # Core
      MODE: api
      MIGRATION_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
      INIT_PASSWORD: ${INIT_PASSWORD:-}
      # Deployment URLs
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost:5001}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost:3000}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost:5001}
      APP_API_URL: ${APP_API_URL:-http://localhost:5001}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
      TRIGGER_URL: ${TRIGGER_URL:-http://api:5001}
      FILES_URL: ${FILES_URL:-http://localhost:5001}
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-dify}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      # Hosted OpenAI provider (pre-configured via env)
      HOSTED_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOSTED_OPENAI_API_BASE: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      # Plugin daemon connection
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      # Sandbox (code executor)
      CODE_EXECUTION_ENDPOINT: ${CODE_EXECUTION_ENDPOINT:-http://sandbox:8194}
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      # Bootstrap vars (for init.py)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      DIFY_MODEL_PRO: ${DIFY_MODEL_PRO:-gpt-4o}
      DIFY_MODEL_LITE: ${DIFY_MODEL_LITE:-gpt-4o-mini}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yusta.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-yusta-admin-123}
      WEB_PORT: ${WEB_PORT:-3000}
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-storage}
      # SSRF proxy timeouts (for marketplace/plugin downloads)
      SSRF_DEFAULT_TIME_OUT: "60"
      SSRF_DEFAULT_READ_TIME_OUT: "60"
      SSRF_DEFAULT_CONNECT_TIME_OUT: "10"
      SSRF_DEFAULT_MAX_RETRIES: "3"
      # Disable telemetry updates check
      CHECK_UPDATE_URL: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    volumes:
      - ./volumes/app/storage:/app/api/storage
      - ./dsls:/dsls:ro
      - ./plugins:/plugins:ro
      - ./scripts/init.py:/init.py:ro
      - ./scripts/deploy.py:/deploy.py:ro
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Dify Worker ──────────────────────────
  worker:
    image: langgenius/dify-api:${DIFY_VERSION:-latest}
    container_name: yusta-dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      MIGRATION_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-dify}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-storage}
      # Trigger URL for workflow execution
      TRIGGER_URL: ${TRIGGER_URL:-http://api:5001}
      # Sandbox (code executor)
      CODE_EXECUTION_ENDPOINT: ${CODE_EXECUTION_ENDPOINT:-http://sandbox:8194}
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      # Hosted OpenAI provider
      HOSTED_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOSTED_OPENAI_API_BASE: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      CHECK_UPDATE_URL: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./volumes/app/storage:/app/api/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Plugin Daemon ────────────────────────
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:${DIFY_PLUGIN_VERSION:-0.6.3-local}
    container_name: yusta-dify-plugin-daemon
    restart: unless-stopped
    environment:
      # Server
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      # Dify inner API (REQUIRED)
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      # Plugin remote installing (REQUIRED)
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      # Storage
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      PLUGIN_INSTALLED_PATH: ${PLUGIN_INSTALLED_PATH:-plugin}
      PLUGIN_PACKAGE_CACHE_PATH: ${PLUGIN_PACKAGE_CACHE_PATH:-plugin_packages}
      PLUGIN_MEDIA_CACHE_PATH: ${PLUGIN_MEDIA_CACHE_PATH:-assets}
      # Timeouts & limits
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STDIO_BUFFER_SIZE: ${PLUGIN_STDIO_BUFFER_SIZE:-1024}
      PLUGIN_STDIO_MAX_BUFFER_SIZE: ${PLUGIN_STDIO_MAX_BUFFER_SIZE:-5242880}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      # Signature verification
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      # Misc
      PPROF_ENABLED: ${PLUGIN_PPROF_ENABLED:-false}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./volumes/plugin_daemon:/app/storage
    ports:
      - "${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Dify Web (Frontend) ──────────────────
  web:
    image: langgenius/dify-web:${DIFY_VERSION:-latest}
    container_name: yusta-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost:5001}
      APP_API_URL: ${APP_API_URL:-http://localhost:5001}
      NEXT_PUBLIC_SENTRY_DSN: ""
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  # ── Init: Bootstrap DSLs & Provider ──────
  init:
    image: alpine:3.21
    container_name: yusta-dify-init
    depends_on:
      api:
        condition: service_started
    environment:
      CONSOLE_API_URL: http://api:5001
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yusta.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-yusta-admin-123}
      INIT_PASSWORD: ${INIT_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      DIFY_MODEL_PRO: ${DIFY_MODEL_PRO:-gpt-4o}
      DIFY_MODEL_LITE: ${DIFY_MODEL_LITE:-gpt-4o-mini}
      WEB_PORT: ${WEB_PORT:-3000}
    volumes:
      - ./dsls:/dsls:ro
      - ./scripts/init.sh:/init.sh:ro
      - ./scripts/init.py:/init.py:ro
      - ./scripts/deploy.py:/deploy.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dify_db:
  dify_redis:
  dify_storage:
