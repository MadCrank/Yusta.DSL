        code: "def main(blocks, clarifying_questions):\n    cq = list(clarifying_questions\
          \ or [])\n    blk = list(blocks or [])\n    if cq:\n        blk.append({\"\
          title\": \"Уточняющие вопросы\", \"questions\": cq})\n    bi = len(blk)\
          \ - 1\n    qi = 0\n    question = \"\"\n    progress = \"\"\n    if bi >=\
          \ 0 and bi < len(blk):\n        qs = blk[bi].get(\"questions\", []) or []\n\
          \        if qi < len(qs):\n            question = qs[qi]\n            total\
          \ = sum(len(b.get(\"questions\", []) or []) for b in blk)\n            before\
          \ = sum(len(b.get(\"questions\", []) or []) for b in blk[:bi])\n       \
          \     progress = \"Вопрос %d из %d · Блок %d/%d: %s\" % (before + qi + 1,\
          \ total, bi + 1, len(blk), blk[bi].get(\"title\", \"\"))\n    return {\"\
          blocks\": blk, \"block_idx\": bi, \"question_idx\": qi, \"question\": question,\
          \ \"progress\": progress}"
