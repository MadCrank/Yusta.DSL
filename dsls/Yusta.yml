    - id: '1759438620189'
      type: custom
      data:
        type: answer
        title: Ответ 5
        desc: ''
        selected: false
        variables: []
        answer: "Следуй шагам ниже, и всё получится :)\n\n1️⃣ Подготовь данные\n\n\
          Что нужно собрать заранее:\n1. Назначение формы или фичи\n2. Формы, элементы\
          \ и поля\n3. Сценарии использования\n4. Зависимости, настройки и особенности\n\
          \nЕсли чего-то не хватит я задам тебе уточняющие вопросы.\n\n2️⃣ Начни с\
          \ простого\n\nОпиши всё, что знаешь — в свободной форме, с логичным разделением\
          \ на абзацы. Например:\n\n\"При выборе способа авторизации По паролю отображаются\
          \ по умолчанию пустые поля Электронная почта и Пароль. При хоть одном незаполненном\
          \ поле и нажатии кнопки Далее отобразится информационное сообщение «Введите\
          \ логин и пароль для авторизации». \"\n\n3️⃣ Я создам черновик статьи, разобью\
          \ текст на абзацы и списки для лучшей читаемости. Если данных не хватает,\
          \ сформируется блок «Уточняющие вопросы». Отвечай на них кратко и по существу,\
          \ без рассуждений — это важно для точности документа.\n\n4️⃣ После повторной\
          \ генерации твои ответы добавятся в новый вариант статьи. \n\nЕсли данных\
          \ не хватает, блок «Уточняющие вопросы» сформируется снова.\n\n5️⃣ Проверь\
          \ итог\n\nФинальный документ должен быть:\n1. Формальным и безличным\n2.\
          \ Структурированным\n3. С корректным использованием терминологии\n4. Читаемым\
          \ и логичным.\n\n✅ Быстрая самопроверка\n\nПеред завершением убедись, что\
          \ документ содержит:\n1. Все формы и элементы интерфейса\n2. Логику работы\
          \ формы/ фичи\n3. Все ответы на уточняющие вопросы"
